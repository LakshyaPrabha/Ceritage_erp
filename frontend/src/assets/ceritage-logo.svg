<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 160" fill="none">
  <defs>
    <linearGradient id="logoGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%"   stop-color="#3B55E6"/>
      <stop offset="50%"  stop-color="#8B3BC8"/>
      <stop offset="100%" stop-color="#E63B8A"/>
    </linearGradient>
    <linearGradient id="tagGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%"   stop-color="#3B55E6"/>
      <stop offset="100%" stop-color="#8B3BC8"/>
    </linearGradient>
  </defs>
  <!-- CERITAGE wordmark -->
  <text
    x="50%"
    y="95"
    text-anchor="middle"
    font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif"
    font-size="88"
    font-weight="700"
    letter-spacing="4"
    fill="url(#logoGrad)"
  >CERITAGE</text>
  <!-- Tagline -->
  <text
    x="50%"
    y="135"
    text-anchor="middle"
    font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif"
    font-size="22"
    font-weight="400"
    letter-spacing="1"
    fill="url(#tagGrad)"
  >One Vision. One Legacy.</text>
</svg>
